<script>
  // Send any wrong path back to the invitation, keeping ?to=Name if present.
  (function(){
    var parts = location.pathname.split('/').filter(Boolean);
    var base = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
    if (location.pathname === base) base = '/';   // user/organisation site or custom domain: avoid a loop
    location.replace(base + location.search + location.hash);
  })();
</script>
